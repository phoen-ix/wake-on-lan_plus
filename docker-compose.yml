services:
  wake-on-lan_plus:
    image: ghcr.io/phoen-ix/wake-on-lan_plus:${WAKE_ON_LAN_PLUS_IMAGE:-latest}
    container_name: ${CONTAINER_NAME:-wake-on-lan_plus}
    environment:
      - WOL_USERNAME=${WOL_USERNAME:-}
      - WOL_PASSWORD=${WOL_PASSWORD:-}
      - WOL_RATE_LIMIT_CONFIG_SET=${WOL_RATE_LIMIT_CONFIG_SET:-}
      - WOL_RATE_LIMIT_HOST_CHECK=${WOL_RATE_LIMIT_HOST_CHECK:-}
      - WOL_RATE_LIMIT_HOST_WAKEUP=${WOL_RATE_LIMIT_HOST_WAKEUP:-}
      - WOL_RATE_LIMIT_WINDOW_SECS=${WOL_RATE_LIMIT_WINDOW_SECS:-}
    ports:
      - "${HOST_PORT:-3880}:${CONTAINER_PORT:-80}"
    networks:
      macvlan_network:
        ipv4_address: 192.168.1.x # Specify a free IP address from your LAN
    volumes:
      # config.json and config_backups/, outside the web root (WOL_CONFIG_DIR)
      - ./volume/config/:/data

networks:
  macvlan_network:
    external: true
