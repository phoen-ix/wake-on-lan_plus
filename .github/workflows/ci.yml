name: CI

on:
  push:
    branches: [master]
    # Release tags (v1.2.3) run the tests and publish the image as 1.2.3.
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/phoen-ix/wake-on-lan_plus

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The app image installs the sockets extension that wakeOnLan() needs,
      # so building it doubles as the Dockerfile check and the test runtime.
      - name: Build the image
        run: docker build -t wol-ci .

      - name: Lint (php -l on every PHP file)
        run: |
          docker run --rm --entrypoint sh -v "$PWD":/app:ro -w /app wol-ci -c \
            'find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l > /dev/null'

      - name: Test
        run: docker run --rm --entrypoint php -v "$PWD":/app:ro -w /app wol-ci tests/test_functions.php

  # Publishes ghcr.io/phoen-ix/wake-on-lan_plus once the tests pass:
  #   master -> latest + sha-<short>, tag v1.2.3 -> 1.2.3.
  # Never from pull requests, and only from this repository (a fork's run
  # cannot push to this package).
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'phoen-ix/wake-on-lan_plus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Annotate the multi-arch index too, so GHCR shows the description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # latest only follows master, never a (possibly older) tag.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          # The generated labels/annotations already carry the repo URL, title,
          # description, license and revision; source is spelled out because it
          # is what links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=https://github.com/phoen-ix/wake-on-lan_plus
          annotations: |
            org.opencontainers.image.source=https://github.com/phoen-ix/wake-on-lan_plus

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # master writes the layer cache; tag builds can read master's scope.
          cache-from: type=gha
          cache-to: type=gha,mode=max
